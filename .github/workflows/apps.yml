name: Build Windows & Android apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
    tags: ['v*']

concurrency:
  group: apps
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: ./
      - name: Package the .exe
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          New-Item -ItemType Directory -Force desktop/app | Out-Null
          Copy-Item client/dist/* desktop/app -Recurse
          Set-Location desktop
          npm install
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Rune-Setup.exe
            desktop/dist/Rune-Portable.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: ./
      - name: Build the APK
        working-directory: mobile
        run: |
          npm install
          rm -rf www && cp -r ../client/dist www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#121212' --iconBackgroundColorDark '#121212' || echo "Icon generation skipped"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Rune.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/Rune.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads
          name: Rune downloads
          body: |
            Latest builds of **Rune**.

            - **Windows**: `Rune-Setup.exe` (installer) or `Rune-Portable.exe` (no install).
            - **Android**: `Rune.apk` (allow “Install unknown apps” for your browser/files app).

            The apps are not code-signed, so Windows SmartScreen / Android may show a warning — choose *More info → Run anyway* / *Install anyway*.
            Your library lives inside each app; move data between devices with **Profile → Export / Import data**.
          files: out/*
